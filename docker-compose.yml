services:
  db:
    image: mysql:8
    container_name: servicasa_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: servicasa_db
      MYSQL_ROOT_PASSWORD: root1234
    volumes:
      - servicasa_db_data:/var/lib/mysql
    networks:
      - servicasa-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicasa_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/servicasa_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
    networks:
      - servicasa-net

  frontend:
    build:
      context: ../ServiCasa_Frontend
      dockerfile: Dockerfile
    container_name: servicasa_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - servicasa-net

volumes:
  servicasa_db_data:

networks:
  servicasa-net:
    driver: bridge